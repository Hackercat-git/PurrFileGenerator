<svg xmlns="http://www.w3.org/2000/svg" width="300" height="155" viewBox="0 0 300 155" role="img" aria-label="Hackercat-git GitHub stats compact">
<title>Hackercat-git on GitHub — purrfile compact</title>
<defs>
<style>:root{--bg1:#0a0018;--bg2:#020009;--ac1:#22d3ee;--ac2:#e879f9;--tm:#f0f9ff;--td:#67e8f9;--lc0:#22d3ee;--lc1:#e879f9;--lc2:#34d399;--lc3:#f472b6;--lc4:#818cf8;}@media(prefers-color-scheme:light){:root{--bg1:#f0f9ff;--bg2:#e0f2fe;--ac1:#0891b2;--ac2:#a21caf;--tm:#0c0a1e;--td:#0e7490;}}.tm{fill:var(--tm)}.td{fill:var(--td)}.lc0{fill:var(--lc0)}.lc1{fill:var(--lc1)}.lc2{fill:var(--lc2)}.lc3{fill:var(--lc3)}.lc4{fill:var(--lc4)}@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{from{opacity:0}to{opacity:1}}.s0{animation:fadeUp .5s ease .05s both}.s1{animation:fadeUp .5s ease .15s both}.s2{animation:fadeUp .5s ease .25s both}.s3{animation:fadeUp .5s ease .38s both}.s4{animation:fadeUp .5s ease .50s both}.ll{animation:fadeIn .6s ease .9s both}.ft{animation:fadeIn .6s ease 1.1s both}</style>
<linearGradient id="g-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--bg1)"/><stop offset="1" style="stop-color:var(--bg2)"/></linearGradient>
<linearGradient id="g-ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--ac1)"/><stop offset="1" style="stop-color:var(--ac2)"/></linearGradient>
<clipPath id="bc"><rect x="18" y="96" width="264" height="8" rx="4"/></clipPath>
<clipPath id="ba"><rect x="18" y="96" height="8"><animate attributeName="width" from="0" to="264" dur="1.1s" begin="0.4s" fill="freeze"/></rect></clipPath>
</defs>
<rect x=".5" y=".5" width="299" height="154" rx="12" fill="url(#g-bg)" style="stroke:var(--ac1)" stroke-opacity=".28"/>
<g transform="translate(272,20) scale(1.0)" style="fill:none;stroke:var(--ac1);stroke-width:1.8;stroke-linecap:round"><path d="M-8,-6 L-2,0 L-8,6"/><line x1="1" y1="6" x2="8" y2="6"/></g>
<text x="18" y="26" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" class="tm">Hackercat-git</text>
<rect x="18" y="32" width="30" height="2.5" rx="1.2" fill="url(#g-ac)"/>
<text x="18" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" class="tm s0">2</text>
<text x="18" y="73" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" class="td s0">Repos</text>
<text x="84" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" class="tm s1">1</text>
<text x="84" y="73" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" class="td s1">Stars</text>
<text x="150" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" class="tm s2">0</text>
<text x="150" y="73" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" class="td s2">Forks</text>
<text x="216" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" class="tm s3">0d</text>
<text x="216" y="73" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" class="td s3">Streak</text>
<text x="18" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" class="td">Languages</text>
<g clip-path="url(#bc)"><g clip-path="url(#ba)">
<rect x="18" y="96" width="264" height="8" style="fill:var(--bg1)"/>
<rect x="18.00" y="96" width="264.00" height="8" class="lc0"/>
</g></g>
<g class="ll">
<circle cx="22" cy="117" r="3.5" class="lc0"/>
<text x="30" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" class="td">Python 100%</text>
</g>
<text x="290" y="149" font-family="Segoe UI, Arial, sans-serif" font-size="8" class="td ft" text-anchor="end" opacity=".55">purrfile · 29 Sep 2026</text>
</svg>